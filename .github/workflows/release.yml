name: Native macOS Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, ancestry, version, and shared tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag without release credentials
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "release tag verification failed: $*" >&2; exit 1; }

          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "tag must be an exact vX.Y.Z version"
          version="${tag#v}"
          major="${version%%.*}"
          [[ "$major" != 0 && "$major" != 1 ]] \
            || fail "native releases must have major version 2 or newer"
          [[ "$GITHUB_REF" == "refs/tags/$tag" ]] || fail "event ref is not the release tag"
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] \
            || fail "release tags must be annotated"
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] \
            || fail "tag does not peel to the workflow commit"

          git fetch --force --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main \
            || fail "release commit is not an ancestor of origin/main"
          git fetch --force --tags origin

          exact_tags="$(git tag --list | \
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true)"
          [[ -n "$exact_tags" ]] || fail "release tag is missing after fetching tags"
          highest_tag="$(printf '%s\n' "$exact_tags" | sort -V | tail -n 1)"
          [[ "$highest_tag" == "$tag" ]] \
            || fail "$tag is not greater than existing exact version tag $highest_tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: './src-tauri -> target'
      - name: Verify synchronized release version
        run: node scripts/release-version.js check "${{ steps.tag.outputs.version }}"
      - name: Run legacy updater validator suites
        shell: bash
        run: |
          set -euo pipefail
          node native/Scripts/tests/verify-legacy-tauri-manifest.test.js
          node --test native/Scripts/tests/generate-latest-json.test.js
          bash native/Scripts/tests/verify-legacy-tauri-update-contract.test.sh
      - name: Install shared test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev
      - name: JavaScript tests
        run: npm test
      - name: Rust tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

  native-test:
    name: Native tests and unsigned packaged checks
    needs: verify
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Require the pinned Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          native/Scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.46.0"
          echo "$RUNNER_TEMP/xcodegen-2.46.0/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned helper and generated project
        shell: bash
        run: |
          set -euo pipefail
          CCBUD_BIFROST_ARCH=universal native/Scripts/fetch-bifrost.sh
          xcodegen generate --spec native/project.yml --project native
          git diff --exit-code -- native/CCBuddy.xcodeproj
          node scripts/release-version.js check "${{ needs.verify.outputs.version }}"
      - name: Install pinned loopback E2E CLIs
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/ccbud-cli-e2e"
          npm install --prefix "$cli_root" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund \
            '@openai/codex@0.149.0-darwin-arm64' \
            '@anthropic-ai/claude-code-darwin-arm64@2.1.237'
          codex="$cli_root/node_modules/@openai/codex/vendor/aarch64-apple-darwin/bin/codex"
          claude="$cli_root/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude"
          test -x "$codex" && test "$(lipo -archs "$codex")" = arm64
          test -x "$claude" && test "$(lipo -archs "$claude")" = arm64
          test "$("$codex" --version)" = 'codex-cli 0.149.0'
          test "$("$claude" --version)" = '2.1.237 (Claude Code)'
          mkdir -p native/Vendor/test-tools
          cp "$codex" native/Vendor/test-tools/codex
          cp "$claude" native/Vendor/test-tools/claude
          chmod 755 native/Vendor/test-tools/codex native/Vendor/test-tools/claude
          cmp -s "$codex" native/Vendor/test-tools/codex
          cmp -s "$claude" native/Vendor/test-tools/claude
      - name: Run native unit tests with all real E2Es
        shell: bash
        env:
          CCBUD_BIFROST_BINARY: ${{ github.workspace }}/native/Vendor/bifrost-http
          CCBUD_CODEX_BINARY: ${{ runner.temp }}/ccbud-cli-e2e/node_modules/@openai/codex/vendor/aarch64-apple-darwin/bin/codex
          CCBUD_CLAUDE_BINARY: ${{ runner.temp }}/ccbud-cli-e2e/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude
          CCBUD_HOME: ${{ runner.temp }}/ccbud-native-unit/ccbud
          CCBUD_CLAUDE_SETTINGS: ${{ runner.temp }}/ccbud-native-unit/claude/settings.json
          CCBUD_CODEX_CONFIG: ${{ runner.temp }}/ccbud-native-unit/codex/config.toml
        run: |
          set -euo pipefail
          mkdir -p "$CCBUD_HOME" "$(dirname "$CCBUD_CLAUDE_SETTINGS")" \
            "$(dirname "$CCBUD_CODEX_CONFIG")"
          result="$RUNNER_TEMP/CCBuddyTests.xcresult"
          summary="$RUNNER_TEMP/CCBuddyTests-summary.json"
          tests="$RUNNER_TEMP/CCBuddyTests-tests.json"
          test ! -e "$result"
          xcodebuild test \
            -project native/CCBuddy.xcodeproj \
            -scheme CCBuddy \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:CCBuddyTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath "$result" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=-
          xcrun xcresulttool get test-results summary \
            --path "$result" --compact > "$summary"
          xcrun xcresulttool get test-results tests \
            --path "$result" --compact > "$tests"
          jq -e '.result == "Passed" and .totalTestCount > 0
            and .passedTests == .totalTestCount and .failedTests == 0
            and .skippedTests == 0 and .expectedFailures == 0' "$summary"
          jq -e '[.. | objects | select(.nodeType == "Test Case")
            | select((.nodeIdentifier // "")
              | test("^(BifrostSupervisorIntegrationTests|BifrostResponsesProtocolIntegrationTests|ClaudeCLIBifrostE2ETests)/"))] as $e2e
            | (($e2e | length) >= 11 and all($e2e[]; .result == "Passed"))' "$tests"
          jq '{result,totalTestCount,passedTests,failedTests,skippedTests,expectedFailures}' \
            "$summary"
      - name: Run native UI tests
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/CCBuddyUITests.xcresult"
          summary="$RUNNER_TEMP/CCBuddyUITests-summary.json"
          ui_bundle_id="dev.ccbud.gateway.ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          test ! -e "$result"
          xcodebuild test \
            -project native/CCBuddy.xcodeproj \
            -scheme CCBuddy \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:CCBuddyUITests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath "$result" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
            ENABLE_HARDENED_RUNTIME=NO \
            CCBUD_PRODUCT_BUNDLE_IDENTIFIER="$ui_bundle_id"
          xcrun xcresulttool get test-results summary \
            --path "$result" --compact > "$summary"
          # Counted, not pinned: an exact total meant every added UI test failed this gate while
          # passing, and "all of them passed, none skipped" is the property being enforced. The
          # floor still catches a suite that silently stopped running.
          jq -e '.result == "Passed" and .totalTestCount >= 10
            and .passedTests == .totalTestCount and .failedTests == 0
            and .skippedTests == 0 and .expectedFailures == 0' "$summary"
          jq '{result,totalTestCount,passedTests,failedTests,skippedTests,expectedFailures}' \
            "$summary"
      - name: Run the Bifrost helper validator suite
        shell: bash
        run: bash native/Scripts/tests/verify-bifrost.test.sh
      - name: Build, exercise, and package the unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          native/Scripts/build-native-release.sh unsigned "$version" \
            "${{ github.run_number }}" "$RUNNER_TEMP/ccbud-native/app"
          native/Scripts/run-packaged-selfcheck.sh \
            "$RUNNER_TEMP/ccbud-native/app/CC Buddy.app" 150
          native/Scripts/test-single-instance-handoff.sh \
            "$RUNNER_TEMP/ccbud-native/app/CC Buddy.app" 20
          native/Scripts/package-native-release.sh unsigned \
            "$RUNNER_TEMP/ccbud-native/app/CC Buddy.app" "$version" \
            "$RUNNER_TEMP/ccbud-native/artifacts"
      - name: Upload unsigned validation artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unsigned-native-validation-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/ccbud-native/artifacts/*
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Sign, notarize, and package the native universal build
    needs: [verify, native-test]
    runs-on: macos-26
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Require the pinned Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
      - name: Install build dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          native/Scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.46.0"
          echo "$RUNNER_TEMP/xcodegen-2.46.0/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned helper and generated project
        shell: bash
        run: |
          set -euo pipefail
          CCBUD_BIFROST_ARCH=universal native/Scripts/fetch-bifrost.sh
          xcodegen generate --spec native/project.yml --project native
          git diff --exit-code -- native/CCBuddy.xcodeproj
          node scripts/release-version.js check "${{ needs.verify.outputs.version }}"
      - name: Verify updater signing key and password
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          unset updater_key updater_password
          updater_key="$TAURI_SIGNING_PRIVATE_KEY"
          updater_password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          [[ -n "$updater_key" ]] || { echo 'missing TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          [[ -n "$updater_password" ]] \
            || { echo 'missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }

          preflight_root="$(mktemp -d "$RUNNER_TEMP/ccbud-updater-preflight.XXXXXX")"
          trap 'rm -rf -- "$preflight_root"' EXIT INT TERM HUP
          printf '%s\n' 'CC Buddy updater signing key preflight' > "$preflight_root/input"
          TAURI_SIGNING_PRIVATE_KEY="$updater_key" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$updater_password" \
            npx --no-install tauri signer sign "$preflight_root/input"
          test -s "$preflight_root/input.sig"
      - name: Import credentials, sign, notarize, package, and destroy credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          unset apple_certificate apple_certificate_password apple_signing_identity
          unset apple_team_id apple_api_key_p8 apple_api_key_id apple_api_issuer
          unset updater_key updater_password keychain_password
          apple_certificate="$APPLE_CERTIFICATE"
          apple_certificate_password="$APPLE_CERTIFICATE_PASSWORD"
          apple_signing_identity="$APPLE_SIGNING_IDENTITY"
          apple_team_id="$APPLE_TEAM_ID"
          apple_api_key_p8="$APPLE_API_KEY_P8"
          apple_api_key_id="$APPLE_API_KEY_ID"
          apple_api_issuer="$APPLE_API_ISSUER"
          updater_key="$TAURI_SIGNING_PRIVATE_KEY"
          updater_password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          unset APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          [[ -n "$apple_certificate" ]] || { echo 'missing MAC_CSC_LINK' >&2; exit 1; }
          [[ -n "$apple_certificate_password" ]] \
            || { echo 'missing MAC_CSC_KEY_PASSWORD' >&2; exit 1; }
          [[ "$apple_signing_identity" == Developer\ ID\ Application:* ]] \
            || { echo 'invalid APPLE_SIGNING_IDENTITY' >&2; exit 1; }
          [[ "$apple_team_id" == 2CGR266XD2 ]] || { echo 'invalid APPLE_TEAM_ID' >&2; exit 1; }
          [[ -n "$apple_api_key_p8" ]] || { echo 'missing APPLE_API_KEY_P8' >&2; exit 1; }
          [[ "$apple_api_key_id" =~ ^[A-Za-z0-9]+$ ]] \
            || { echo 'invalid APPLE_API_KEY_ID' >&2; exit 1; }
          [[ "$apple_api_issuer" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] \
            || { echo 'invalid APPLE_API_ISSUER' >&2; exit 1; }
          [[ -n "$updater_key" ]] || { echo 'missing TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          [[ -n "$updater_password" ]] \
            || { echo 'missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }

          keychain_path="$RUNNER_TEMP/ccbud-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${apple_api_key_id}.p8"
          [[ ! -e "$keychain_path" ]] || { echo 'temporary keychain already exists' >&2; exit 1; }
          [[ ! -e "$api_key_path" ]] || { echo 'temporary API key already exists' >&2; exit 1; }

          original_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain%"${keychain##*[![:space:]]}"}"
            [[ -z "$keychain" ]] || original_keychains+=("$keychain")
          done < <(security list-keychains -d user)

          cleanup_credentials() {
            set +e
            security lock-keychain "$keychain_path" >/dev/null 2>&1
            security delete-keychain "$keychain_path" >/dev/null 2>&1
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1
            fi
            rm -f -- "$api_key_path" "$RUNNER_TEMP/ccbud-developer-id.p12"
            return 0
          }
          trap cleanup_credentials EXIT INT TERM HUP

          keychain_password="$(openssl rand -hex 24)"
          imported_path="$(
            APPLE_CERTIFICATE="$apple_certificate" \
            APPLE_CERTIFICATE_PASSWORD="$apple_certificate_password" \
            APPLE_SIGNING_IDENTITY="$apple_signing_identity" \
            CCBUD_KEYCHAIN_PASSWORD="$keychain_password" \
            CCBUD_KEYCHAIN_PATH="$keychain_path" \
              native/Scripts/import-signing-certificate.sh | tail -n 1
          )"
          [[ "$imported_path" == "$keychain_path" ]] \
            || { echo 'signing certificate import returned an unexpected keychain' >&2; exit 1; }
          unset apple_certificate apple_certificate_password keychain_password

          APPLE_TEAM_ID="$apple_team_id" \
          APPLE_SIGNING_IDENTITY="$apple_signing_identity" \
          CCBUD_KEYCHAIN="$keychain_path" \
            native/Scripts/build-native-release.sh signed \
              "${{ needs.verify.outputs.version }}" "${{ github.run_number }}" \
              "$RUNNER_TEMP/ccbud-native/app"

          printf '%s' "$apple_api_key_p8" | openssl base64 -d -A -out "$api_key_path"
          test -s "$api_key_path"
          unset apple_api_key_p8

          APPLE_API_KEY_PATH="$api_key_path" \
          APPLE_API_KEY_ID="$apple_api_key_id" \
          APPLE_API_ISSUER="$apple_api_issuer" \
          APPLE_SIGNING_IDENTITY="$apple_signing_identity" \
          TAURI_SIGNING_PRIVATE_KEY="$updater_key" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$updater_password" \
            native/Scripts/package-native-release.sh signed \
              "$RUNNER_TEMP/ccbud-native/app/CC Buddy.app" \
              "${{ needs.verify.outputs.version }}" \
              "$RUNNER_TEMP/ccbud-native/artifacts" "${{ github.repository }}"

          cleanup_credentials
          trap - EXIT INT TERM HUP
      - name: Validate the legacy Tauri 1.3.9 updater input contract
        shell: bash
        run: |
          set -euo pipefail
          native/Scripts/verify-legacy-tauri-update-contract.sh \
            "$RUNNER_TEMP/ccbud-native/artifacts/CC.Buddy_universal.app.tar.gz" \
            "$RUNNER_TEMP/ccbud-native/artifacts/CC.Buddy_universal.app.tar.gz.sig" \
            "$RUNNER_TEMP/ccbud-native/artifacts/latest.json" \
            "${{ needs.verify.outputs.version }}" "${{ github.repository }}"
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/ccbud-native/artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish one complete GitHub Release
    needs: [verify, build-native]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-release-${{ needs.verify.outputs.version }}
          path: dist
      - name: Validate exact release inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "CC.Buddy_${VERSION}_universal.dmg" \
            'CC.Buddy_universal.app.tar.gz' \
            'CC.Buddy_universal.app.tar.gz.sig' \
            'latest.json' | sort)"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]]
          [[ "$TAG" == "v$VERSION" ]]
          jq -e --arg version "$VERSION" '.version == $version' dist/latest.json
          # Every macOS key must resolve to the one universal archive. A 1.3.9 updater on an Intel
          # Mac reads darwin-x86_64 and nothing else, so a key going missing here strands it.
          jq -e '
            [.platforms["darwin-aarch64-app"], .platforms["darwin-aarch64"],
             .platforms["darwin-x86_64-app"], .platforms["darwin-x86_64"]]
            | length == 4 and (unique | length) == 1
          ' dist/latest.json
          archive_sha="$(sha256sum dist/CC.Buddy_universal.app.tar.gz | awk '{print $1}')"
          [[ "$(jq -r '.platforms["darwin-aarch64-app"].sha256' dist/latest.json)" \
            == "$archive_sha" ]]
          signature="$(tr -d '\r\n' < dist/CC.Buddy_universal.app.tar.gz.sig)"
          [[ "$(jq -r '.platforms["darwin-aarch64-app"].signature' dist/latest.json)" \
            == "$signature" ]]
      - name: Create draft and upload all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')" == true ]]
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "CC Buddy $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify uploaded inventory and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]]
          mkdir "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RUNNER_TEMP/release-check"
          cmp dist/latest.json "$RUNNER_TEMP/release-check/latest.json"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    name: Publish universal macOS Homebrew cask
    needs: [verify, publish]
    runs-on: ubuntu-22.04
    environment: release
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'ccbud/homebrew-tap' }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-release-${{ needs.verify.outputs.version }}
          path: dist
      - name: Require the public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft')" == false ]]
      - name: Generate pinned universal macOS cask
        run: |
          node scripts/update-cask.js dist homebrew/Casks/ccbud.rb
          ruby -c homebrew/Casks/ccbud.rb
          grep -F 'releases/download/v#{version}/CC.Buddy_#{version}_universal.dmg' \
            homebrew/Casks/ccbud.rb
          if grep -Fq 'depends_on arch:' homebrew/Casks/ccbud.rb; then
            echo 'universal cask must not be architecture-restricted' >&2
            exit 1
          fi
          if grep -Fq ':no_check' homebrew/Casks/ccbud.rb; then
            echo 'cask checksum must not use :no_check' >&2
            exit 1
          fi
      - name: Prepare the tap commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp homebrew/Casks/ccbud.rb tap/Casks/ccbud.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/ccbud.rb
          if ! git diff --cached --quiet; then
            git commit -m "ccbud ${VERSION}"
          fi
      - name: Push cask to tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          unset tap_token authorization
          tap_token="$HOMEBREW_TAP_TOKEN"
          unset HOMEBREW_TAP_TOKEN
          [[ -n "$tap_token" ]] || { echo 'missing HOMEBREW_TAP_TOKEN' >&2; exit 1; }
          authorization="$(printf 'x-access-token:%s' "$tap_token" | base64 | tr -d '\r\n')"
          cd tap
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            git push origin HEAD:main
