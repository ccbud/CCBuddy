name: CCbuddy macOS Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  # Keep every queued main push and serialize version allocation and publication.
  group: ccbuddy-macos-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  verify:
    name: Allocate or verify the release tag, main ancestry, and version
    runs-on: ubuntu-24.04
    permissions:
      # Pushes only the immutable annotated version tag; main never moves.
      contents: write
    outputs:
      should_release: ${{ steps.existing.outputs.published != 'true' }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # This isolated job pushes only the version tag. Checkout removes the token afterwards.
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Allocate a version for the main push or verify the supplied tag
        id: version
        run: node packages/desktop/scripts/prepare-main-release.mjs
      - name: Do not rebuild an already public release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null)" && [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already public; keeping its immutable assets."
          fi

  build:
    name: Sign, notarize, and verify arm64 release
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCBUDDY_ENV: production
      CCBUDDY_PREVIEW_IDENTITY: "0"
      CCBUDDY_SKIP_REMOTE_ASSETS: "1"
      CCBUDDY_TARGET_OS: mac
      CCBUDDY_TARGET_ARCH: arm64
      CCBUDDY_ENABLE_MAC_SIGN: "1"
      CCBUDDY_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest-mac.yml
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HUSKY: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Require arm64 runner and install locked workspace
        run: |
          test "$(uname -m)" = arm64
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile
      - name: Import Developer ID certificate into a temporary keychain
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          [[ "$APPLE_SIGNING_IDENTITY" == Developer\ ID\ Application:* ]]
          cert="$RUNNER_TEMP/ccbuddy-developer-id.p12"
          keychain="$RUNNER_TEMP/ccbuddy-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "${MAC_CSC_LINK#*base64,}" | openssl base64 -d -A -out "$cert"
          test -s "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t agg -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -F "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null
          rm -f "$cert"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_NAME=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare runtime and build production desktop
        run: |
          pnpm --filter @ccbuddy/desktop run prepare:runtime-assets
          pnpm build:bootstrap
      - name: Sign embedded macOS command-line tools
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q '^Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" --keychain "$CSC_KEYCHAIN" "$candidate"
              codesign --verify --strict "$candidate"
            fi
          done < <(find packages/desktop/bundled-tools/darwin-arm64 \
            packages/desktop/resources/macos-window-bounds -type f -print0)
      - name: Package signed app, ZIP, and DMG
        run: |
          pnpm --filter @ccbuddy/desktop run bundle -- --os mac --arch arm64 --skip-prepare --skip-build
          app=packages/desktop/dist/mac-arm64/CCbuddy.app
          version="${{ needs.verify.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = app.ccbuddy.desktop
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          LC_ALL=C grep -aFq "$CCBUDDY_UPDATE_MANIFEST_URL" "$app/Contents/Resources/app.asar"
          test -s "packages/desktop/dist/CCbuddy-${version}-mac-arm64.zip"
          test -s "packages/desktop/dist/CCbuddy-${version}-mac-arm64.dmg"
      - name: Notarize ZIP and DMG, then staple DMG
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          key="$RUNNER_TEMP/ccbuddy-notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$key"
          test -s "$key"
          version="${{ needs.verify.outputs.version }}"
          zip="packages/desktop/dist/CCbuddy-${version}-mac-arm64.zip"
          dmg="packages/desktop/dist/CCbuddy-${version}-mac-arm64.dmg"
          xcrun notarytool submit "$zip" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t exec packages/desktop/dist/mac-arm64/CCbuddy.app
      - name: Finalize and validate the updater manifest
        run: |
          node packages/desktop/scripts/finalize-macos-release.mjs packages/desktop/dist
          version="${{ needs.verify.outputs.version }}"
          unzip -t "packages/desktop/dist/CCbuddy-${version}-mac-arm64.zip"
      - name: Upload complete release inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ccbuddy-macos-${{ needs.verify.outputs.version }}
          path: |
            packages/desktop/dist/CCbuddy-${{ needs.verify.outputs.version }}-mac-arm64.zip
            packages/desktop/dist/CCbuddy-${{ needs.verify.outputs.version }}-mac-arm64.zip.blockmap
            packages/desktop/dist/CCbuddy-${{ needs.verify.outputs.version }}-mac-arm64.dmg
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ccbuddy-developer-id.p12" "$RUNNER_TEMP/ccbuddy-notary.p8"
          if [ -f "$RUNNER_TEMP/ccbuddy-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/ccbuddy-signing.keychain-db"
          fi

  publish:
    name: Publish one complete GitHub Release
    needs: [verify, build]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ccbuddy-macos-${{ needs.verify.outputs.version }}
          path: dist
      - name: Verify immutable tag, monotonic latest, and downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "${{ needs.verify.outputs.commit }}"
          node packages/desktop/scripts/prepare-main-release.mjs --verify \
            "${{ needs.verify.outputs.commit }}" "$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft > "$RUNNER_TEMP/existing-release" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/existing-release")" = true
          fi
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            LATEST_TAG="$latest" node --input-type=module -e '
              const parse = (tag) => {
                if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
                return tag.slice(1).split(".").map(Number);
              };
              const next = parse(process.env.TAG);
              const current = parse(process.env.LATEST_TAG);
              for (let i = 0; i < 3; i++) {
                if (next[i] > current[i]) process.exit(0);
                if (next[i] < current[i]) throw new Error("Release would move latest backwards");
              }
              throw new Error("Release is already the latest version");
            '
          fi
          zip="CCbuddy-${VERSION}-mac-arm64.zip"
          dmg="CCbuddy-${VERSION}-mac-arm64.dmg"
          expected="$(printf '%s\n' "$zip" "$zip.blockmap" "$dmg" latest-mac.yml | sort)"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          sha="$(openssl dgst -sha512 -binary "dist/$zip" | openssl base64 -A)"
          grep -Fx "version: $VERSION" dist/latest-mac.yml
          grep -Fx "  - url: $zip" dist/latest-mac.yml
          grep -Fx "path: $zip" dist/latest-mac.yml
          grep -Fx "sha512: $sha" dist/latest-mac.yml
          test "$(grep -c '^  - url:' dist/latest-mac.yml)" = 1
      - name: Create or reuse draft and upload all assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "CCbuddy $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify inventory and publish as latest
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected"
          mkdir "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest-mac.yml --dir "$RUNNER_TEMP/release-check"
          cmp dist/latest-mac.yml "$RUNNER_TEMP/release-check/latest-mac.yml"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
