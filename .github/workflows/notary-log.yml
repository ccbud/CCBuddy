name: Fetch Apple Notarization Log

# One-shot diagnostic for the failed v2.0.2 submission. It runs only when this trusted file lands
# on main and will be removed with the notarization fix after the rejection details are captured.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notary-log.yml'

permissions: {}

jobs:
  fetch-log:
    name: Fetch notarization rejection details
    runs-on: macos-26
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Fetch the Apple notarization log
        shell: bash
        env:
          SUBMISSION_ID: a6e75dbd-6bad-423a-bdc8-ac4ed183e3c0
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          submission_id="$SUBMISSION_ID"
          api_key_p8="$APPLE_API_KEY_P8"
          api_key_id="$APPLE_API_KEY_ID"
          api_issuer="$APPLE_API_ISSUER"
          unset SUBMISSION_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER

          [[ "$submission_id" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] \
            || { echo 'invalid submission UUID' >&2; exit 1; }
          [[ -n "$api_key_p8" ]] || { echo 'missing APPLE_API_KEY_P8' >&2; exit 1; }
          [[ "$api_key_id" =~ ^[A-Za-z0-9]+$ ]] \
            || { echo 'invalid APPLE_API_KEY_ID' >&2; exit 1; }
          [[ "$api_issuer" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] \
            || { echo 'invalid APPLE_API_ISSUER' >&2; exit 1; }

          api_key_path="$RUNNER_TEMP/AuthKey_${api_key_id}.p8"
          cleanup() { rm -f -- "$api_key_path"; }
          trap cleanup EXIT INT TERM HUP
          printf '%s' "$api_key_p8" | openssl base64 -d -A -out "$api_key_path"
          test -s "$api_key_path"
          unset api_key_p8

          xcrun notarytool log "$submission_id" --key "$api_key_path" \
            --key-id "$api_key_id" --issuer "$api_issuer"
