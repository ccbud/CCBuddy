name: PR Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ccbuddy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type, lint, format, architecture, and updater tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Install pinned pnpm and locked workspace
        run: |
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Check types, lint, formatting, and architecture
        run: |
          pnpm typecheck
          pnpm lint
          pnpm fmt:check
          pnpm architecture:check --changed
      - name: Test desktop update and release manifest policy
        run: >-
          pnpm exec tsx --test
          packages/desktop/test/ccbuddy-update-policy.test.mjs
          packages/desktop/test/finalize-macos-release.test.mjs

  macos-package:
    name: Build unsigned macOS arm64 package
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCBUDDY_ENV: production
      CCBUDDY_PREVIEW_IDENTITY: "0"
      CCBUDDY_SKIP_REMOTE_ASSETS: "1"
      CCBUDDY_TARGET_OS: mac
      CCBUDDY_TARGET_ARCH: arm64
      HUSKY: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Require arm64 runner and install dependencies
        run: |
          test "$(uname -m)" = arm64
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile
      - name: Prepare local runtime and build desktop
        run: |
          pnpm --filter @ccbuddy/desktop run prepare:runtime-assets
          pnpm build:bootstrap
      - name: Package and verify unsigned ZIP and DMG
        run: |
          pnpm --filter @ccbuddy/desktop run bundle -- --os mac --arch arm64 --skip-prepare --skip-build
          version="$(node -p 'require("./package.json").version')"
          test -s "packages/desktop/dist/CCbuddy-${version}-mac-arm64.zip"
          test -s "packages/desktop/dist/CCbuddy-${version}-mac-arm64.dmg"
          test -s packages/desktop/dist/latest-mac.yml
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' packages/desktop/dist/mac-arm64/CCbuddy.app/Contents/Info.plist)" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' packages/desktop/dist/mac-arm64/CCbuddy.app/Contents/Info.plist)" = app.ccbuddy.desktop
