name: CCBuddy
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CCBUD_PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: >-
      $(inherited)
      -Xcc -DZSTDLIB_VISIBLE=
      -Xcc -DZSTDLIB_HIDDEN=
      -Xcc -DZSTD_CLEVEL_DEFAULT=3
      -Xcc -DZDICTLIB_VISIBLE=
      -Xcc -DZDICTLIB_HIDDEN=
      -Xcc -DZSTDERRORLIB_VISIBLE=
      -Xcc -DZSTDERRORLIB_HIDDEN=
packages:
  zstd:
    url: https://github.com/facebook/zstd
    exactVersion: 1.5.7
targets:
  CCBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: ../LICENSE
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../build/icon.png
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../src-tauri/icons/icon.icns
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../src/renderer/assets
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: Vendor/ccbud-gateway
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
    preBuildScripts:
      - name: Verify source-built gateway helper
        script: '"$SRCROOT/Scripts/verify-gateway-helper.sh" "$SRCROOT/Vendor/ccbud-gateway" "$ARCHS"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/GatewayHelper/Cargo.toml
          - $(SRCROOT)/GatewayHelper/Cargo.lock
          - $(SRCROOT)/GatewayHelper/NOTICE
          - $(SRCROOT)/GatewayHelper/THIRD-PARTY-NOTICES.txt
          - $(SRCROOT)/Resources/CCBuddyGateway-NOTICE.txt
          - $(SRCROOT)/Resources/CCBuddyGateway-THIRD-PARTY-NOTICES.txt
          - $(SRCROOT)/Vendor/ccbud-gateway
    dependencies:
      - package: zstd
        product: libzstd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CCBUD_PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: "CC Buddy"
        PRODUCT_MODULE_NAME: CCBuddy
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/CCBuddy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - CCBuddyTests
        - CCBuddyUITests
  CCBuddyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: CCBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CC Buddy.app/Contents/MacOS/CC Buddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CCBuddyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: CCBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway.uitests
        GENERATE_INFOPLIST_FILE: YES
