name: CCBuddy
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CCBUD_PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "2.0.5"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CCBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: ../LICENSE
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../build/icon.png
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../src-tauri/icons/icon.icns
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../src/renderer/assets
        group: Resources
        createIntermediateGroups: false
        buildPhase: resources
      - path: Vendor/bifrost-http
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
    preBuildScripts:
      - name: Verify pinned Bifrost helper
        script: '"$SRCROOT/Scripts/verify-bifrost.sh" "$SRCROOT/Vendor/bifrost-http" "$ARCHS"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Vendor/bifrost-http
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CCBUD_PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: "CC Buddy"
        PRODUCT_MODULE_NAME: CCBuddy
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/CCBuddy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - CCBuddyTests
        - CCBuddyUITests
  CCBuddyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: CCBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CC Buddy.app/Contents/MacOS/CC Buddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CCBuddyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: CCBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ccbud.gateway.uitests
        GENERATE_INFOPLIST_FILE: YES
