<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://*.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.clarity.ms https://*.clarity.ms; img-src 'self' data: asset: http://asset.localhost" />
    <title>CC Buddy</title>
    <link rel="stylesheet" href="styles.css" />
    <link id="hljs-light" rel="stylesheet" href="vendor/hljs-light.css" />
    <link id="hljs-dark" rel="stylesheet" href="vendor/hljs-dark.css" media="not all" />
    <script src="theme-boot.js"></script>
  </head>
  <body>
    <div class="app-window flex h-screen bg-bg-app border border-window-border rounded-[14px] overflow-hidden shadow-[inset_0_0.5px_0_rgba(255,255,255,0.12)]">
      <aside class="sidebar drag-region group/sidebar backdrop-blur-md bg-bg-sidebar/70 border-r border-border-custom/40 w-[196px] group-[.collapsed]/sidebar:w-[52px] transition-[width] duration-220 ease-[cubic-bezier(0.23,1,0.32,1)] flex flex-col pt-0 pb-3.5 px-[10px] group-[.collapsed]/sidebar:px-[5px] flex-shrink-0">
        <div class="h-14 drag-region shrink-0"></div>
        <header class="sidebar-brand no-drag flex items-center gap-[9px] px-[6px] pb-5">
          <div class="logo w-[30px] h-[30px] flex-shrink-0 drop-shadow-[0_2px_8px_var(--brand-glow)]" id="appLogo" aria-hidden="true"></div>
          <div class="brand-text group-[.collapsed]/sidebar:hidden">
            <div class="brand-title text-[15px] font-semibold tracking-[-0.02em] leading-[1.15] transition-colors duration-200 [&.running]:text-green" id="brandTitle">CC Buddy</div>
            <div class="brand-sub" data-i18n="brand.sub">Coding CLI Buddy</div>
          </div>
        </header>

        <nav class="sidebar-nav no-drag flex flex-col gap-2 flex-grow" id="tabs" aria-label="Navigation">
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0 active" data-view="providers" data-i18n-title="nav.providers" title="服务" aria-label="服务">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="providers"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.providers">服务</span>
          </button>
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0" data-view="plugins" data-i18n-title="nav.plugins" title="插件" aria-label="插件">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="plugins"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.plugins">插件</span>
          </button>
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0" data-view="skills" data-i18n-title="nav.skills" title="Skills" aria-label="Skills">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="skills"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.skills">Skills</span>
          </button>
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0" data-view="conversations" data-i18n-title="nav.conversations" title="会话" aria-label="会话">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="conversations"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.conversations">会话</span>
          </button>
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0" data-view="monitor" data-i18n-title="nav.monitor" title="监控" aria-label="监控">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="monitor"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.monitor">监控</span>
          </button>
          <button type="button" class="nav-item flex items-center gap-[9px] px-3 py-2.5 border-none rounded-[10px] bg-transparent text-muted font-medium text-[13.5px] leading-[1.2] cursor-pointer text-left transition-all duration-180 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-chip-bg hover:text-fg active:scale-[0.98] [&.active]:bg-brand-soft [&.active]:text-brand [&.active]:font-semibold group-[.collapsed]/sidebar:justify-center group-[.collapsed]/sidebar:px-0" data-view="settings" data-i18n-title="nav.settings" title="设置" aria-label="设置">
            <span class="nav-icon w-4 h-4 flex items-center justify-center opacity-85 [.active_&]:opacity-100" data-icon="settings"></span>
            <span class="nav-label group-[.collapsed]/sidebar:hidden" data-i18n="nav.settings">设置</span>
          </button>
        </nav>

        <footer class="sidebar-foot no-drag mt-auto pt-3 border-t border-border-custom/50 flex items-center justify-between gap-2 group-[.collapsed]/sidebar:justify-center">
          <div class="status-chip inline-flex items-center gap-[5px] px-[10px] py-[3.5px] rounded-full text-[11.5px] font-semibold text-muted bg-chip-bg tracking-[-0.01em] [&.on]:text-green [&.on]:bg-green-soft group-[.collapsed]/sidebar:hidden" id="statusPill">
            <span class="status-dot w-[5px] h-[5px] rounded-full bg-current"></span>
            <span class="status-text" data-i18n="status.disconnected">未接入</span>
          </div>
          <div class="foot-tools flex gap-1 shrink-0 group-[.collapsed]/sidebar:flex-col group-[.collapsed]/sidebar:items-center group-[.collapsed]/sidebar:gap-[3px]">
            <button id="btnCollapseSidebar" class="tool-btn w-[26px] h-[26px] border border-border-custom rounded-[7px] bg-bg-elev text-muted cursor-pointer flex items-center justify-center transition-all duration-140 hover:text-fg hover:bg-chip-bg hover:border-border-strong" data-i18n-title="side.collapse" title="收起侧边栏" aria-label="收起侧边栏">
              <span data-icon="chevronLeft"></span>
            </button>
            <button id="btnTheme" class="tool-btn w-[26px] h-[26px] border border-border-custom rounded-[7px] bg-bg-elev text-muted cursor-pointer flex items-center justify-center transition-all duration-140 hover:text-fg hover:bg-chip-bg hover:border-border-strong" data-i18n-title="side.theme" title="切换主题" aria-label="切换主题">
              <span data-icon="theme"></span>
            </button>
          </div>
        </footer>
      </aside>

      <main class="main-panel flex-1 min-h-0 flex flex-col overflow-hidden min-w-0">
        <div class="titlebar-drag drag-region h-9 shrink-0"></div>
        <div class="main-scroll flex-grow min-h-0 overflow-y-auto overflow-x-hidden scrollbar-gutter-stable has-[#view-conversations:not(.hidden)]:overflow-hidden has-[#view-conversations:not(.hidden)]:flex has-[#view-conversations:not(.hidden)]:flex-col has-[#view-settings:not(.hidden)]:overflow-hidden has-[#view-settings:not(.hidden)]:flex has-[#view-settings:not(.hidden)]:flex-col has-[#view-skills:not(.hidden)]:overflow-hidden has-[#view-skills:not(.hidden)]:flex has-[#view-skills:not(.hidden)]:flex-col" id="mainScroll">

        <!-- 服务 — the first-paint view stays inline; every other view lazy-mounts from its
             JS template on first switch (js/views/registry.js), keeping cold start light. -->
        <section id="view-providers" class="panel flex-none max-w-[1120px] mx-auto px-10 pt-4 pb-10 w-full flex flex-col gap-6 animate-[panelIn_0.28s_ease-[cubic-bezier(0.23,1,0.32,1)]]">
          <header class="panel-hero group/hero flex flex-wrap items-center gap-x-6 gap-y-5 p-6 bg-bg-elev border border-border-custom rounded-[18px] shadow-card transition-all duration-300 hover:border-brand-3/30 relative overflow-hidden [&.connected]:border-green/30 bg-gradient-to-tr from-brand-soft/20 via-transparent to-brand-3/5" id="hero">
            <div class="hero-body flex items-center gap-3 flex-1 min-w-0">
              <div class="hero-icon w-[38px] h-[38px] rounded-[10px] bg-chip-bg text-muted flex items-center justify-center shrink-0 transition-all duration-220 ease-[cubic-bezier(0.23,1,0.32,1)] group-[.connected]/hero:bg-green-soft group-[.connected]/hero:text-green" id="heroIcon"></div>
              <div class="hero-copy">
                <h1 class="hero-title text-[16.5px] font-semibold tracking-[-0.02em] leading-tight" id="heroTitle" data-i18n="hero.titleIdle">未接入</h1>
                <p class="hero-desc text-[12.5px] text-muted mt-[2.5px] leading-[1.35] [&_b]:text-fg [&_b]:font-medium" id="heroSub" data-i18n="hero.subIdle">选择服务，一键写入 Claude Code 配置</p>
              </div>
            </div>
            <button class="hero-action border-none rounded-[9px] px-[18px] py-2 font-semibold text-[12px] leading-none tracking-[-0.01em] cursor-pointer bg-gradient-to-b from-brand-2 to-brand text-white shadow-[0_1px_2px_rgba(88,86,214,0.25),_0_4px_12px_rgba(88,86,214,0.18)] transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow-[0_2px_4px_rgba(88,86,214,0.3),_0_8px_20px_rgba(88,86,214,0.22)] active:scale-[0.96] whitespace-nowrap group-[.connected]/hero:bg-none group-[.connected]/hero:bg-red-soft group-[.connected]/hero:text-red group-[.connected]/hero:border group-[.connected]/hero:border-red/18 group-[.connected]/hero:shadow-none group-[.connected]/hero:hover:bg-red group-[.connected]/hero:hover:text-white group-[.connected]/hero:hover:border-transparent" id="btnConnect" data-i18n="hero.connect">一键接入</button>
            <div class="hero-usage hidden w-full flex flex-col gap-2 pt-3 mt-1 border-t border-border-custom" id="heroUsage">
              <div class="flex items-center justify-between gap-3 flex-wrap">
                <button type="button" class="hero-endpoint inline-flex items-center gap-1.5 font-mono text-[12px] text-muted hover:text-fg transition-colors no-drag cursor-pointer" id="heroEndpoint" data-i18n-title="hero.copyEndpoint" title="复制网关地址"><span class="w-1.5 h-1.5 rounded-full bg-green shrink-0"></span><span id="heroEndpointText">localhost:8788</span></button>
                <div class="inline-flex gap-0.5 p-0.5 bg-chip-bg rounded-[7px]" id="heroRanges">
                  <button class="seg-btn border-0 bg-transparent text-muted text-[11px] font-medium px-2 py-0.75 rounded-[5px] cursor-pointer hover:text-fg [.active]:bg-bg-elev [.active]:text-fg [.active]:shadow-sm transition-all duration-150" data-hrange="7d" data-i18n="range.7d">7天</button>
                  <button class="seg-btn border-0 bg-transparent text-muted text-[11px] font-medium px-2 py-0.75 rounded-[5px] cursor-pointer hover:text-fg [.active]:bg-bg-elev [.active]:text-fg [.active]:shadow-sm transition-all duration-150 active" data-hrange="30d" data-i18n="range.30d">30天</button>
                  <button class="seg-btn border-0 bg-transparent text-muted text-[11px] font-medium px-2 py-0.75 rounded-[5px] cursor-pointer hover:text-fg [.active]:bg-bg-elev [.active]:text-fg [.active]:shadow-sm transition-all duration-150" data-hrange="all" data-i18n="range.all">全部</button>
                </div>
              </div>
              <div class="flex items-baseline gap-2 flex-wrap leading-none">
                <span class="text-[23px] font-bold tracking-tight text-fg font-mono" id="heroTokens">0</span>
                <span class="text-[11px] text-muted">tokens</span>
                <span class="text-border-strong px-0.5">·</span>
                <span class="text-[12px] text-caption" id="heroReqs">0</span>
                <span class="text-[12px] text-caption truncate max-w-[200px] font-mono" id="heroModel"></span>
              </div>
              <div class="hero-spark w-full h-[46px]" id="heroSpark"></div>
            </div>
            <p class="hero-hint hidden w-full px-2.5 py-1.5 rounded-[7px] text-[12px] leading-[1.4] text-fg bg-primary-soft border-l-2 border-primary [&.warn]:bg-amber-soft [&.warn]:border-l-amber" id="heroNote"></p>
          </header>

          <div class="panel-toolbar flex items-center justify-between px-[2px] py-1">
            <h2 class="panel-label text-[12.5px] font-semibold tracking-[0.04em] uppercase text-caption" data-i18n="providers.label">服务商</h2>
            <div class="toolbar-end flex items-center gap-2.5">
              <span class="caption text-[12px] text-caption" id="provHint" data-i18n="providers.hint">点选切换 · 拖动排序</span>
              <button id="btnAdd" class="fab w-[26px] h-[26px] border-none rounded-full cursor-pointer bg-gradient-to-b from-[#FFAB40] to-orange text-white flex items-center justify-center shadow-[0_2px_8px_rgba(255,149,0,0.28)] transition-transform duration-140 ease-[cubic-bezier(0.23,1,0.32,1)] hover:scale-106" data-i18n-title="providers.add" title="添加服务" aria-label="添加服务">
                <span data-icon="plus"></span>
              </button>
            </div>
          </div>

          <div id="providerList" class="provider-list flex flex-col gap-2"></div>

          <div id="emptyProviders" class="state-empty text-center px-5 py-8 border border-dashed border-border-custom rounded-xl text-muted text-[12px] leading-normal [&_p]:mb-3">
            <div class="state-icon flex justify-center mb-2.5 text-caption" data-icon="empty"></div>
            <p data-i18n="providers.empty">尚未添加服务商</p>
            <button class="btn btn-sm bg-bg-elev text-fg border border-border-custom rounded-md px-2.25 py-1.25 font-medium text-[11px] leading-none cursor-pointer transition-all duration-140 hover:bg-chip-bg hover:border-border-strong active:scale-[0.985]" id="btnAddEmpty" data-i18n="providers.addFirst">添加第一个服务</button>
          </div>
        </section>
        </div>
      </main>
    </div>

    <script src="analytics.js" defer></script>
    <script src="analytics-events.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
